<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knee Osteoarthritis (OA) Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-xl bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 text-center">
        <h1 class="text-3xl font-extrabold text-blue-400 mb-2">Knee OA Early Detection</h1>
        <p class="text-slate-400 text-sm mb-6">AI-Powered Knee Osteoarthritis Screening System</p>

        <!-- Upload Box -->
        <div class="border-2 border-dashed border-blue-500/50 rounded-xl p-8 hover:border-blue-400 transition cursor-pointer" onclick="document.getElementById('xrayInput').click()">
            <input type="file" id="xrayInput" accept="image/*" class="hidden" onchange="previewImage(event)">
            <svg class="w-12 h-12 mx-auto text-blue-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
            <p class="font-medium text-slate-200">Click to upload Knee X-Ray</p>
            <p class="text-xs text-slate-400 mt-1">Supports PNG, JPG, JPEG</p>
        </div>

        <!-- Preview & Analyze -->
        <div id="previewContainer" class="hidden mt-6">
            <img id="imagePreview" class="max-h-56 mx-auto rounded-lg border border-slate-700 shadow-md mb-4" />
            <button onclick="analyzeImage()" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-3 px-6 rounded-xl transition">
                Analyze X-Ray
            </button>
        </div>

        <!-- Output Result -->
        <div id="resultBox" class="hidden mt-6 p-4 bg-slate-700/60 border border-slate-600 rounded-xl text-left">
            <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Diagnosis Result</p>
            <div id="statusBadge" class="inline-block px-3 py-1 rounded-full text-sm font-bold mt-2"></div>
            <p id="detailsText" class="text-sm text-slate-300 mt-2"></p>
        </div>
    </div>

    <script>
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('resultBox').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function analyzeImage() {
            const resultBox = document.getElementById('resultBox');
            const badge = document.getElementById('statusBadge');
            const details = document.getElementById('detailsText');

            resultBox.classList.remove('hidden');
            badge.className = 'inline-block px-3 py-1 rounded-full text-sm font-bold mt-2 bg-yellow-500/20 text-yellow-400 border border-yellow-500/40';
            badge.innerText = 'Analyzing X-Ray...';
            details.innerText = 'Scanning joint space width and osteophyte formation...';

            setTimeout(() => {
                badge.className = 'inline-block px-3 py-1 rounded-full text-sm font-bold mt-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/40';
                badge.innerText = 'KL Grade 0: Normal';
                details.innerText = 'Confidence: 94.6% - No significant signs of Osteoarthritis detected.';
            }, 1200);
        }
    </script>
</body>
</html>
